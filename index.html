<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CETPRO San Pedro - Control de Asistencia</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0088cc;
            --primary-dark: #005580;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --bg-glass: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0d1117 url('https://img.magnific.com/vector-gratis/gradiente-formas-geometricas-concepto-fondo-oscuro_23-2148438263.jpg?semt=ais_hybrid&w=740&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .main-container {
            width: 100%;
            max-width: 950px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 136, 204, 0.2);
            padding: 30px;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 20px;
            margin-bottom: 25px;
            text-align: center;
            flex-wrap: wrap;
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            background: #fff;
            object-fit: cover;
        }

        .header-title h1 {
            font-size: 26px;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 136, 204, 0.5);
        }

        .header-title p {
            color: var(--gold-light);
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 15px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn i {
            font-size: 16px;
        }

        .tab-btn:hover {
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 136, 204, 0.5);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.4);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 136, 204, 0.3);
            color: #ffffff;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }

        tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }
        .badge-presente { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-ausente { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .badge-tardanza { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-card h4 {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 5px;
        }

        .stat-card span {
            font-size: 22px;
            font-weight: bold;
        }

        .empty-msg {
            text-align: center;
            padding: 25px;
            color: var(--text-muted);
            font-style: italic;
        }

        @media (max-width: 600px) {
            .tabs {
                flex-direction: column;
            }
            .header-title h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <img src="image_4fde9f.jpg" alt="CETPRO San Pedro Logo" class="logo-img">
        <div class="header-title">
            <h1>CETPRO SAN PEDRO</h1>
            <p>APLAO - CASTILLA | R.D. 2025</p>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('registrar', this)">
            <i class="fa-solid fa-user-plus"></i> Registrar Estudiante
        </button>
        <button class="tab-btn" onclick="showTab('marcar', this)">
            <i class="fa-solid fa-clipboard-user"></i> Marcar Asistencia
        </button>
        <button class="tab-btn" onclick="showTab('ver', this)">
            <i class="fa-solid fa-list-check"></i> Ver Listado
        </button>
    </div>

    <!-- SECCIÓN 1: Registrar Estudiante -->
    <div id="registrar" class="tab-content active">
        <form id="studentForm">
            <div class="form-group">
                <label for="studentId"><i class="fa-solid fa-id-card"></i> DNI / Código de Estudiante:</label>
                <input type="text" id="studentId" required placeholder="Ej: 71234567">
            </div>
            <div class="form-group">
                <label for="studentName"><i class="fa-solid fa-user"></i> Nombre Completo:</label>
                <input type="text" id="studentName" required placeholder="Ej: Juan Carlos Pérez">
            </div>
            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-floppy-disk"></i> Guardar Estudiante
            </button>
        </form>

        <br>
        <h3 style="margin-bottom: 12px; font-size: 16px;"><i class="fa-solid fa-users"></i> Estudiantes Registrados</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre Completo</th>
                        <th style="width: 80px; text-align: center;">Acción</th>
                    </tr>
                </thead>
                <tbody id="registeredStudentsList">
                    <!-- Se cargan dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- SECCIÓN 2: Marcar Asistencia -->
    <div id="marcar" class="tab-content">
        <div class="form-group">
            <label for="attendanceDate"><i class="fa-solid fa-calendar-day"></i> Seleccionar Fecha:</label>
            <input type="date" id="attendanceDate">
        </div>

        <form id="markForm">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Estudiante</th>
                            <th>Estado de Asistencia</th>
                        </tr>
                    </thead>
                    <tbody id="markTableBody">
                        <!-- Estudiantes para marcar lista -->
                    </tbody>
                </table>
            </div>
            <br>
            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-check-double"></i> Guardar Asistencia del Día
            </button>
        </form>
    </div>

    <!-- SECCIÓN 3: Ver Listado -->
    <div id="ver" class="tab-content">
        <div class="form-group">
            <label for="filterDate"><i class="fa-solid fa-filter"></i> Consultar Fecha:</label>
            <input type="date" id="filterDate" onchange="renderHistory()">
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h4>Presentes</h4>
                <span id="statPresente" style="color: var(--success)">0</span>
            </div>
            <div class="stat-card">
                <h4>Tardanzas</h4>
                <span id="statTardanza" style="color: var(--warning)">0</span>
            </div>
            <div class="stat-card">
                <h4>Ausentes</h4>
                <span id="statAusente" style="color: var(--danger)">0</span>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Estudiante</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!-- Registros del día consultado -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Configurar fechas iniciales
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('attendanceDate').value = today;
    document.getElementById('filterDate').value = today;

    // Almacenamiento Local
    let students = JSON.parse(localStorage.getItem('cetpro_students')) || [];
    let attendanceRecords = JSON.parse(localStorage.getItem('cetpro_attendance')) || {};

    // Cambiar de Pestaña
    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');

        if (tabId === 'registrar') renderRegisteredStudents();
        if (tabId === 'marcar') renderMarkTable();
        if (tabId === 'ver') renderHistory();
    }

    // Guardar Estudiante
    document.getElementById('studentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('studentId').value.trim();
        const name = document.getElementById('studentName').value.trim();

        if (students.some(s => s.id === id)) {
            alert('El código/DNI ya está registrado.');
            return;
        }

        students.push({ id, name });
        localStorage.setItem('cetpro_students', JSON.stringify(students));
        this.reset();
        renderRegisteredStudents();
        alert('Estudiante registrado correctamente.');
    });

    // Renderizar estudiantes en módulo de registro
    function renderRegisteredStudents() {
        const tbody = document.getElementById('registeredStudentsList');
        tbody.innerHTML = '';

        if (students.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="empty-msg">No hay estudiantes registrados.</td></tr>';
            return;
        }

        students.forEach((student, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td style="text-align: center;">
                    <button onclick="deleteStudent(${index})" style="background:none; border:none; color:var(--danger); cursor:pointer;">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Eliminar estudiante
    function deleteStudent(index) {
        if (confirm('¿Deseas eliminar a este estudiante?')) {
            students.splice(index, 1);
            localStorage.setItem('cetpro_students', JSON.stringify(students));
            renderRegisteredStudents();
        }
    }

    // Cargar tabla de marcar asistencia
    function renderMarkTable() {
        const tbody = document.getElementById('markTableBody');
        tbody.innerHTML = '';

        if (students.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="empty-msg">Primero debes registrar estudiantes.</td></tr>';
            return;
        }

        students.forEach(student => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>
                    <select name="status_${student.id}">
                        <option value="Presente">Presente</option>
                        <option value="Tardanza">Tardanza</option>
                        <option value="Ausente">Ausente</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Guardar Asistencia
    document.getElementById('markForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const date = document.getElementById('attendanceDate').value;

        if (!date) {
            alert('Selecciona una fecha válida.');
            return;
        }

        if (students.length === 0) {
            alert('No hay estudiantes para marcar asistencia.');
            return;
        }

        const dailyRecord = students.map(student => {
            const select = document.querySelector(`select[name="status_${student.id}"]`);
            return {
                id: student.id,
                name: student.name,
                status: select ? select.value : 'Presente'
            };
        });

        attendanceRecords[date] = dailyRecord;
        localStorage.setItem('cetpro_attendance', JSON.stringify(attendanceRecords));
        alert(`Asistencia guardada para la fecha ${date}`);
    });

    // Renderizar historial y estadísticas
    function renderHistory() {
        const date = document.getElementById('filterDate').value;
        const tbody = document.getElementById('historyTableBody');
        tbody.innerHTML = '';

        const record = attendanceRecords[date];

        let pCount = 0, tCount = 0, aCount = 0;

        if (!record || record.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="empty-msg">Sin registros de asistencia para esta fecha.</td></tr>';
        } else {
            record.forEach(item => {
                if (item.status === 'Presente') pCount++;
                if (item.status === 'Tardanza') tCount++;
                if (item.status === 'Ausente') aCount++;

                let badgeClass = 'badge-presente';
                if (item.status === 'Ausente') badgeClass = 'badge-ausente';
                if (item.status === 'Tardanza') badgeClass = 'badge-tardanza';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.name}</td>
                    <td><span class="badge ${badgeClass}">${item.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('statPresente').textContent = pCount;
        document.getElementById('statTardanza').textContent = tCount;
        document.getElementById('statAusente').textContent = aCount;
    }

    // Inicializar lista
    renderRegisteredStudents();
</script>

</body>
</html>
